<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>text{font-family:-apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif}.m{font-family:SFMono-Regular, Menlo, Consolas, monospace}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#aaa"/></marker></defs>
<rect width="1000" height="430" fill="#ffffff"/>
<text x="40" y="40" font-size="21" font-weight="700" fill="#333">The model only fixes words; a compiler writes the cron</text>
<rect x="408" y="62" width="184" height="160" rx="12" fill="#ececec"/>
<rect x="598" y="62" width="374" height="160" rx="12" fill="#ececec"/>
<text x="420" y="90" font-size="14" letter-spacing="1" fill="#444">FUZZY · LEARNED</text>
<text x="610" y="90" font-size="14" letter-spacing="1" fill="#444">EXACT · DETERMINISTIC</text>
<rect x="30" y="110" width="160" height="96" rx="10" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.5"/>
<text x="110" y="143" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">Your sentence</text>
<text x="110" y="169" text-anchor="middle" font-size="15.5" fill="#555">“evrey wensday</text>
<text x="110" y="191" text-anchor="middle" font-size="15.5" fill="#555">at half past 4”</text>
<rect x="225" y="110" width="160" height="96" rx="10" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.5"/>
<text x="305" y="143" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">Tokenizer</text>
<text x="305" y="169" text-anchor="middle" font-size="15.5" fill="#555">9:30, 17h30, 1st</text>
<text x="305" y="191" text-anchor="middle" font-size="15.5" fill="#555">mon-fri, 9am</text>
<rect x="420" y="110" width="160" height="96" rx="10" fill="#dbe4f0" stroke="#7d8fa8" stroke-width="2"/>
<text x="500" y="143" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">CronLex</text>
<text x="500" y="169" text-anchor="middle" font-size="15.5" fill="#555">fixes typos</text>
<text x="500" y="191" text-anchor="middle" font-size="15.5" fill="#555">+ distance veto</text>
<rect x="610" y="110" width="160" height="96" rx="10" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.5"/>
<text x="690" y="143" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">17 matchers</text>
<text x="690" y="169" text-anchor="middle" font-size="15.5" fill="#555">intervals, days,</text>
<text x="690" y="191" text-anchor="middle" font-size="15.5" fill="#555">windows → rules</text>
<rect x="800" y="110" width="160" height="96" rx="10" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.5"/>
<text x="880" y="143" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">Compiler</text>
<text x="880" y="169" text-anchor="middle" font-size="15.5" fill="#555">valid cron only</text>
<text x="880" y="191" text-anchor="middle" font-size="15.5" fill="#555">+ week guard</text>
<line x1="194" y1="158" x2="219" y2="158" stroke="#aaa" stroke-width="2" marker-end="url(#a)"/>
<line x1="389" y1="158" x2="414" y2="158" stroke="#aaa" stroke-width="2" marker-end="url(#a)"/>
<line x1="584" y1="158" x2="604" y2="158" stroke="#aaa" stroke-width="2" marker-end="url(#a)"/>
<line x1="774" y1="158" x2="794" y2="158" stroke="#aaa" stroke-width="2" marker-end="url(#a)"/>
<line x1="880" y1="210" x2="880" y2="258" stroke="#aaa" stroke-width="2" marker-end="url(#a)"/>
<rect x="418" y="262" width="542" height="138" rx="10" fill="#fff" stroke="#c9c9c9" stroke-width="1.5"/>
<text x="440" y="292" font-size="18" font-weight="700" fill="#1a1a1a">What you get</text>
<text x="440" y="318" font-size="15.5" fill="#333">One or more cron lines + a plain-English description</text>
<text x="440" y="340" font-size="15.5" fill="#333">Next runs in the right time zone</text>
<text x="440" y="362" font-size="15.5" fill="#333">Assumptions, warnings and a confidence score</text>
<text x="440" y="384" font-size="15.5" fill="#333">A small schedule JSON to store and run later</text>
<text x="40" y="298" font-size="15.5" fill="#444">The model never writes cron.</text>
<text x="40" y="320" font-size="15.5" fill="#444">It only decides which word you meant.</text>
</svg>