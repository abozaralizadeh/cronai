<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="978" viewBox="0 0 1000 978" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>text{font-family:-apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif}.m{font-family:SFMono-Regular, Menlo, Consolas, monospace}</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1226"/><stop offset="1" stop-color="#151a3a"/></linearGradient></defs>
<rect width="1000" height="978" rx="24" fill="url(#g)"/>
<text x="40" y="62" font-size="32" font-weight="700" fill="#ffffff">Type it however you like</text>
<text x="40" y="96" font-size="17" fill="#8b93b8">Real CronAI output. <tspan fill="#fbbf24">Amber</tspan> words were typos fixed by CronLex.</text>
<text x="960" y="62" text-anchor="end" font-size="15" fill="#a5b4fc" class="m">you type → cron</text>
<line x1="40" x2="960" y1="128" y2="128" stroke="#232a45"/>
<text x="40" y="162" font-size="21" fill="#e6e9f5"><tspan fill="#fbbf24" text-decoration="underline">evrey</tspan> <tspan fill="#fbbf24" text-decoration="underline">wensday</tspan> and <tspan fill="#fbbf24" text-decoration="underline">fridy</tspan> at half past 4</text>
<text x="40" y="190" font-size="21" fill="#e6e9f5">in the afternoon except in august</text>
<rect x="560" y="142" width="264" height="28" rx="8" fill="#1b2142" stroke="#3b4580"/>
<text x="574" y="162" font-size="19" fill="#a5b4fc" class="m">30 16 * 1-7,9-12 3,5</text>
<text x="560" y="192" font-size="15" fill="#8b93b8">16:30 Wed + Fri, every month but August</text>
<line x1="40" x2="960" y1="220" y2="220" stroke="#232a45"/>
<text x="40" y="254" font-size="21" fill="#e6e9f5">every 90 minutes</text>
<rect x="560" y="234" width="158" height="28" rx="8" fill="#1b2142" stroke="#3b4580"/>
<text x="574" y="254" font-size="19" fill="#a5b4fc" class="m">0 */3 * * *</text>
<rect x="560" y="266" width="205" height="28" rx="8" fill="#1b2142" stroke="#3b4580"/>
<text x="574" y="286" font-size="19" fill="#a5b4fc" class="m">30 1-22/3 * * *</text>
<text x="560" y="316" font-size="15" fill="#8b93b8">90 does not divide 24h, so two lines</text>
<line x1="40" x2="960" y1="334" y2="334" stroke="#232a45"/>
<text x="40" y="368" font-size="21" fill="#e6e9f5">last friday of the month at 6pm</text>
<rect x="560" y="348" width="158" height="28" rx="8" fill="#1b2142" stroke="#3b4580"/>
<text x="574" y="368" font-size="19" fill="#a5b4fc" class="m">0 18 * * 5L</text>
<text x="560" y="398" font-size="15" fill="#8b93b8">18:00 on the last Friday</text>
<line x1="40" x2="960" y1="416" y2="416" stroke="#232a45"/>
<text x="40" y="450" font-size="21" fill="#e6e9f5">every second tuesday of the month at 10</text>
<rect x="560" y="430" width="170" height="28" rx="8" fill="#1b2142" stroke="#3b4580"/>
<text x="574" y="450" font-size="19" fill="#a5b4fc" class="m">0 10 * * 2#2</text>
<text x="560" y="480" font-size="15" fill="#8b93b8">10:00 on the 2nd Tuesday</text>
<line x1="40" x2="960" y1="498" y2="498" stroke="#232a45"/>
<text x="40" y="532" font-size="21" fill="#e6e9f5">quarter to 9 on weekdays</text>
<rect x="560" y="512" width="170" height="28" rx="8" fill="#1b2142" stroke="#3b4580"/>
<text x="574" y="532" font-size="19" fill="#a5b4fc" class="m">45 8 * * 1-5</text>
<text x="560" y="562" font-size="15" fill="#8b93b8">08:45 Monday to Friday</text>
<line x1="40" x2="960" y1="580" y2="580" stroke="#232a45"/>
<text x="40" y="614" font-size="21" fill="#e6e9f5">every night at 11 except on sundays</text>
<rect x="560" y="594" width="170" height="28" rx="8" fill="#1b2142" stroke="#3b4580"/>
<text x="574" y="614" font-size="19" fill="#a5b4fc" class="m">0 23 * * 1-6</text>
<text x="560" y="644" font-size="15" fill="#8b93b8">'night' turns 11 into 23:00</text>
<line x1="40" x2="960" y1="662" y2="662" stroke="#232a45"/>
<text x="40" y="696" font-size="21" fill="#e6e9f5">first monday of every quarter at 9am</text>
<rect x="560" y="676" width="181" height="28" rx="8" fill="#1b2142" stroke="#3b4580"/>
<text x="574" y="696" font-size="19" fill="#a5b4fc" class="m">0 9 * */3 1#1</text>
<text x="560" y="726" font-size="15" fill="#8b93b8">09:00, first Monday, every 3 months</text>
<line x1="40" x2="960" y1="744" y2="744" stroke="#232a45"/>
<text x="40" y="778" font-size="21" fill="#e6e9f5">every 5 mins from 9 to 5 on <tspan fill="#fbbf24" text-decoration="underline">wekdays</tspan></text>
<rect x="560" y="758" width="217" height="28" rx="8" fill="#1b2142" stroke="#3b4580"/>
<text x="574" y="778" font-size="19" fill="#a5b4fc" class="m">*/5 9-16 * * 1-5</text>
<text x="560" y="808" font-size="15" fill="#8b93b8">'9 to 5' means 09:00 to 16:59</text>
<line x1="40" x2="960" y1="826" y2="826" stroke="#232a45"/>
<text x="40" y="860" font-size="21" fill="#e6e9f5">on christmas at noon</text>
<rect x="560" y="840" width="170" height="28" rx="8" fill="#1b2142" stroke="#3b4580"/>
<text x="574" y="860" font-size="19" fill="#a5b4fc" class="m">0 12 25 12 *</text>
<text x="560" y="890" font-size="15" fill="#8b93b8">12:00 on 25 December</text>
<text x="40" y="948" font-size="14" fill="#5f6790">75k-parameter model + 17 matchers · runs in the browser · ~1 to 15 ms per sentence</text>
</svg>